# Backend: reverse proxies to uvicorn running locally on 127.0.0.1:8081.
# TLS is terminated by Cloudflare Tunnel, so this listens on plain HTTP only.
server {
    listen 80;
    server_name api.dashboard.preyas.ca;

    location / {
        proxy_pass http://127.0.0.1:8081;

        # Preserve the real client's Host/IP/protocol for FastAPI (and its CORS check,
        # which compares against the Origin header the browser sends unchanged).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upgrade headers, needed later for websocket-based live Terraform output (Phase 4)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
