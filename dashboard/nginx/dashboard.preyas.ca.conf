# Frontend: serves the built React app as static files.
# TLS is terminated by Cloudflare Tunnel, so this listens on plain HTTP only.
server {
    listen 80;
    server_name dashboard.preyas.ca;

    root /var/www/dashboard/frontend;
    index index.html;

    location / {
        # SPA fallback: unknown paths (client-side routes) still get index.html
        try_files $uri $uri/ /index.html;
    }
}
