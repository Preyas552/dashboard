# Local DNS for the homelab dashboard only.
# listen-address binds to exactly this IP and nothing else — deliberately the ONLY
# interface-related directive in this file. interface=/except-interface= directives
# merge across every file in /etc/dnsmasq.d/, which is what caused this to bind to
# every interface on the machine (Docker bridges, Tailscale, public IPv6) the first
# time around, via an interaction with ubuntu-fan's except-interface=fan-*.
listen-address=10.0.0.203

# Answer these two hostnames with this machine's LAN IP; nothing else is overridden.
address=/dashboard.preyas.ca/10.0.0.203
address=/api.dashboard.preyas.ca/10.0.0.203

# Everything else gets forwarded upstream untouched, so normal internet browsing
# for every device on the network is completely unaffected.
no-resolv
server=1.1.1.1
server=1.0.0.1
